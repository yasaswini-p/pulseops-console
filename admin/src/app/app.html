@if (auth.user(); as user) {
  <header class="header">
    <div>
      <strong class="brand">PulseOps</strong>
      <span class="muted"> · Operator Console</span>
    </div>
    <div class="header-right">
      <span class="user">{{ user.name }}</span>
      <span class="muted small">{{ user.team }} team</span>
      <button class="btn-outline" (click)="auth.logout()">Log out</button>
    </div>
  </header>
}
<main [class.content]="auth.isLoggedIn()">
  <router-outlet />
</main>
